<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="tc"><rect width="1000" height="320" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#tc)" font-family="'JetBrains Mono',monospace">
    <rect width="1000" height="320" rx="12" fill="#0b0f1a"/>
    <rect width="1000" height="320" rx="12" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.35"/>
    <rect width="1000" height="34" rx="12" fill="#1e1245" opacity="0.85"/>
    <rect y="22" width="1000" height="12" fill="#1e1245" opacity="0.85"/>
    <circle cx="24" cy="17" r="6" fill="#a855f7"/>
    <circle cx="46" cy="17" r="6" fill="#22d3ee"/>
    <circle cx="68" cy="17" r="6" fill="#38bdf8"/>
    <text x="500" y="21" text-anchor="middle" font-size="12" fill="#94a3b8">mahesh@instinct: ~/session</text>
    <!-- boot sequence: each line fades in, whole sequence loops every 16s -->
    <g font-size="15">
      <text x="28" y="66" fill="#c084fc">mahesh@instinct:~$ <tspan fill="#e2e8f0">./init.sh</tspan>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.96;1" dur="16s" repeatCount="indefinite"/></text>
      <text x="28" y="96" fill="#e2e8f0"><tspan fill="#22d3ee" filter="url(#tglow)">[ ok ]</tspan> skills loaded: research · automation · code · writing · scheduling
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.12;0.96;1" dur="16s" repeatCount="indefinite"/></text>
      <text x="28" y="126" fill="#e2e8f0"><tspan fill="#22d3ee" filter="url(#tglow)">[ ok ]</tspan> tools connected: browser · git · mail · calendar · files
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.18;0.22;0.96;1" dur="16s" repeatCount="indefinite"/></text>
      <text x="28" y="156" fill="#e2e8f0"><tspan fill="#22d3ee" filter="url(#tglow)">[ ok ]</tspan> memory online: durable, local-first, nothing invented
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.32;0.96;1" dur="16s" repeatCount="indefinite"/></text>
      <text x="28" y="186" fill="#e2e8f0"><tspan fill="#22d3ee" filter="url(#tglow)">[ ok ]</tspan> guardrails armed: approvals before anything irreversible
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.42;0.96;1" dur="16s" repeatCount="indefinite"/></text>
      <text x="28" y="216" fill="#e2e8f0"><tspan fill="#a855f7">[ &gt;&gt; ]</tspan> all systems green
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.52;0.96;1" dur="16s" repeatCount="indefinite"/></text>
      <text x="28" y="252" fill="#c084fc">mahesh@instinct:~$ <tspan fill="#e2e8f0">awaiting your request</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.62;0.96;1" dur="16s" repeatCount="indefinite"/></text>
      <!-- blinking block cursor: gated to the loop so it only exists after the last line -->
      <g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.63;0.96;1" dur="16s" repeatCount="indefinite"/>
        <rect x="384" y="240" width="9" height="17" fill="#22d3ee">
          <animate attributeName="opacity" values="1;0" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
    <!-- subtle scanlines -->
    <g stroke="#22d3ee" stroke-width="0.5" opacity="0.05">
      <line x1="0" y1="80" x2="1000" y2="80"/><line x1="0" y1="120" x2="1000" y2="120"/><line x1="0" y1="160" x2="1000" y2="160"/>
      <line x1="0" y1="200" x2="1000" y2="200"/><line x1="0" y1="240" x2="1000" y2="240"/><line x1="0" y1="280" x2="1000" y2="280"/>
    </g>
  </g>
</svg>
