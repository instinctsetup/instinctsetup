<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="40" viewBox="0 0 1000 40">
  <defs>
    <linearGradient id="cline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.1"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.7"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="cglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="0" y="19" width="1000" height="2" fill="url(#cline)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-120 0;1120 0" dur="4.5s" repeatCount="indefinite"/>
    <rect x="-90" y="18.5" width="90" height="3" rx="1.5" fill="url(#trail)" opacity="0.8"/>
    <circle cx="0" cy="20" r="5" fill="#67e8f9" filter="url(#cglow)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-120 0;1120 0" dur="4.5s" begin="-2.25s" repeatCount="indefinite"/>
    <rect x="-90" y="18.5" width="90" height="3" rx="1.5" fill="url(#trail)" opacity="0.8"/>
    <circle cx="0" cy="20" r="4" fill="#c084fc" filter="url(#cglow)"/>
  </g>
</svg>
