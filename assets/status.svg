<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.12"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="sglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="sc"><rect width="1000" height="64" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#sc)">
    <rect width="1000" height="64" rx="12" fill="#0f172a"/>
    <rect width="1000" height="64" fill="url(#scan)"><animateTransform attributeName="transform" type="translate" values="-1000 0;1000 0" dur="5s" repeatCount="indefinite"/></rect>
    <rect width="1000" height="64" rx="12" fill="none" stroke="url(#sg)" stroke-width="1.5" opacity="0.55">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- pulsing status dot with expanding sonar rings -->
    <g transform="translate(42 32)">
      <circle r="6" fill="none" stroke="#22d3ee" stroke-width="1.6">
        <animate attributeName="r" values="6;20" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle r="6" fill="none" stroke="#22d3ee" stroke-width="1.6">
        <animate attributeName="r" values="6;20" dur="2s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle r="7" fill="#22d3ee" filter="url(#sglow)">
        <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="76" y="27" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="3" fill="#67e8f9">SYSTEM STATUS</text>
    <text x="76" y="47" font-family="'JetBrains Mono',monospace" font-size="15" font-weight="700" fill="#e0f2fe">ONLINE · READY FOR WORK</text>
    <!-- equalizer bars -->
    <g transform="translate(860 14)" fill="url(#sg)">
      <rect x="0" y="12" width="7" height="24" rx="2"><animate attributeName="height" values="24;10;30;16;24" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="12;26;6;20;12" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="13" y="12" width="7" height="24" rx="2"><animate attributeName="height" values="18;30;8;26;18" dur="1.1s" begin="0.15s" repeatCount="indefinite"/><animate attributeName="y" values="18;6;28;10;18" dur="1.1s" begin="0.15s" repeatCount="indefinite"/></rect>
      <rect x="26" y="12" width="7" height="24" rx="2"><animate attributeName="height" values="28;12;32;14;28" dur="1.5s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="8;24;4;22;8" dur="1.5s" begin="0.3s" repeatCount="indefinite"/></rect>
      <rect x="39" y="12" width="7" height="24" rx="2"><animate attributeName="height" values="14;28;10;24;14" dur="1.2s" begin="0.45s" repeatCount="indefinite"/><animate attributeName="y" values="22;8;26;12;22" dur="1.2s" begin="0.45s" repeatCount="indefinite"/></rect>
      <rect x="52" y="12" width="7" height="24" rx="2"><animate attributeName="height" values="22;8;28;12;22" dur="1.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="14;28;8;24;14" dur="1.4s" begin="0.6s" repeatCount="indefinite"/></rect>
      <rect x="65" y="12" width="7" height="24" rx="2"><animate attributeName="height" values="10;26;14;30;10" dur="1.25s" begin="0.75s" repeatCount="indefinite"/><animate attributeName="y" values="26;10;22;6;26" dur="1.25s" begin="0.75s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
