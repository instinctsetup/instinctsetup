<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"><animate attributeName="stop-color" values="#0b0f1a;#1e1245;#0b0f1a" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.55" stop-color="#3b1d8f"><animate attributeName="stop-color" values="#3b1d8f;#0e7490;#3b1d8f" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#06b6d4"><animate attributeName="stop-color" values="#06b6d4;#7c3aed;#06b6d4" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="c"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.55">
      <circle cx="150" cy="70" r="70" fill="#22d3ee"><animate attributeName="cy" values="70;200;70" dur="9s" repeatCount="indefinite"/><animate attributeName="cx" values="150;230;150" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="210" r="80" fill="#a855f7"><animate attributeName="cy" values="210;60;210" dur="10s" repeatCount="indefinite"/><animate attributeName="cx" values="840;760;840" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="250" r="55" fill="#38bdf8"><animate attributeName="cy" values="250;150;250" dur="7s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#ffffff">
      <circle cx="80" cy="40" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="30" r="1.3"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="45" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="35" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="120" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="190" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    </g>
    <text x="500" y="135" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="6" fill="url(#tx)" filter="url(#glow)">INSTINCT SETUP
      <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
    </text>
    <text x="500" y="182" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#e0f2fe">AN AI ASSISTANT THAT FINISHES THE WORK
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2.4s" fill="freeze"/>
    </text>
    <rect x="420" y="205" width="160" height="3" rx="1.5" fill="#67e8f9"><animate attributeName="width" values="0;160;160" keyTimes="0;0.5;1" dur="2.4s" fill="freeze"/><animate attributeName="x" values="500;420;420" keyTimes="0;0.5;1" dur="2.4s" fill="freeze"/></rect>
    <g fill="none" stroke-width="2">
      <path d="M0 255 Q 125 225 250 255 T 500 255 T 750 255 T 1000 255 T 1250 255 T 1500 255 V280 H0Z" fill="#0b0f1a" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0 0;-500 0" dur="9s" repeatCount="indefinite"/></path>
    </g>
  </g>
</svg>
