<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.6" stop-color="#7c3aed"/><stop offset="1" stop-color="#3b1d8f"/>
    </radialGradient>
    <filter id="oglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="ringpath1" d="M500 95 A105 105 0 1 1 499.9 95" fill="none"/>
    <path id="ringpath2" d="M500 35 A165 165 0 1 1 499.9 35" fill="none"/>
    <style>text{font-family:Segoe UI,Helvetica,Arial,sans-serif}.sk{font-size:13px;font-weight:700;fill:#e2e8f0}</style>
  </defs>

  <!-- orbit rings -->
  <circle cx="500" cy="200" r="105" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 7"/>
  <circle cx="500" cy="200" r="165" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- traveling pulses along the rings -->
  <circle r="4" fill="#22d3ee" filter="url(#oglow)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#ringpath1"/></animateMotion></circle>
  <circle r="3" fill="#a855f7" filter="url(#oglow)"><animateMotion dur="9s" begin="-3s" repeatCount="indefinite"><mpath href="#ringpath2"/></animateMotion></circle>
  <circle r="3" fill="#38bdf8" filter="url(#oglow)"><animateMotion dur="9s" begin="-6.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#ringpath2"/></animateMotion></circle>

  <!-- glowing core -->
  <circle cx="500" cy="200" r="46" fill="url(#core)" filter="url(#oglow)">
    <animate attributeName="r" values="44;50;44" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="200" r="58" fill="none" stroke="#67e8f9" stroke-width="1" stroke-dasharray="10 14" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" values="0 500 200;360 500 200" dur="18s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="206" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="1">instinct</text>

  <!-- inner ring: clockwise, 22s -->
  <g><animateTransform attributeName="transform" type="rotate" values="0 500 200;360 500 200" dur="22s" repeatCount="indefinite"/>
    <g transform="translate(605 200)"><g><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="22s" repeatCount="indefinite"/>
      <circle r="24" fill="#0f172a" stroke="#3776ab" stroke-width="2"/><text y="5" text-anchor="middle" class="sk">Py</text></g></g>
    <g transform="translate(500 305)"><g><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="22s" repeatCount="indefinite"/>
      <circle r="24" fill="#0f172a" stroke="#3178c6" stroke-width="2"/><text y="5" text-anchor="middle" class="sk">TS</text></g></g>
    <g transform="translate(395 200)"><g><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="22s" repeatCount="indefinite"/>
      <circle r="24" fill="#0f172a" stroke="#00add8" stroke-width="2"/><text y="5" text-anchor="middle" class="sk">Go</text></g></g>
    <g transform="translate(500 95)"><g><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="22s" repeatCount="indefinite"/>
      <circle r="24" fill="#0f172a" stroke="#4eaa25" stroke-width="2"/><text y="5" text-anchor="middle" class="sk">Sh</text></g></g>
  </g>

  <!-- outer ring: counter-clockwise, 34s -->
  <g><animateTransform attributeName="transform" type="rotate" values="0 500 200;-360 500 200" dur="34s" repeatCount="indefinite"/>
    <g transform="translate(643 282)"><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="34s" repeatCount="indefinite"/>
      <circle r="24" fill="#0f172a" stroke="#f7df1e" stroke-width="2"/><text y="5" text-anchor="middle" class="sk">JS</text></g></g>
    <g transform="translate(500 365)"><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="34s" repeatCount="indefinite"/>
      <circle r="24" fill="#0f172a" stroke="#f05032" stroke-width="2"/><text y="5" text-anchor="middle" class="sk">Git</text></g></g>
    <g transform="translate(357 282)"><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="34s" repeatCount="indefinite"/>
      <circle r="24" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/><text y="5" text-anchor="middle" class="sk">GH</text></g></g>
    <g transform="translate(357 117)"><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="34s" repeatCount="indefinite"/>
      <circle r="24" fill="#0f172a" stroke="#fcc624" stroke-width="2"/><text y="5" text-anchor="middle" class="sk">Lnx</text></g></g>
    <g transform="translate(500 35)"><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="34s" repeatCount="indefinite"/>
      <circle r="24" fill="#0f172a" stroke="#e34f26" stroke-width="2"/><text y="5" text-anchor="middle" class="sk">HTML</text></g></g>
    <g transform="translate(643 117)"><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="34s" repeatCount="indefinite"/>
      <circle r="24" fill="#0f172a" stroke="#1572b6" stroke-width="2"/><text y="5" text-anchor="middle" class="sk">CSS</text></g></g>
  </g>
</svg>
