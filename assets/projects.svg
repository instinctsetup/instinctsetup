<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470">
  <defs>
    <filter id="pg" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="pshine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#a5f3fc" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>text{font-family:Segoe UI,Helvetica,Arial,sans-serif}.pn{font-size:17px;font-weight:700}.pd{font-size:12.5px;fill:#cbd5e1}.pl{font-size:11.5px;fill:#94a3b8}</style>

  <g transform="translate(10 10)"><rect width="320" height="215" rx="14" fill="#0f172a"/>
    <rect width="320" height="215" rx="14" fill="none" stroke="#3178c6" stroke-width="2.5" filter="url(#pg)" opacity="0.5"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.4s" begin="0s" repeatCount="indefinite"/></rect>
    <rect width="320" height="215" rx="14" fill="none" stroke="#3178c6" stroke-width="1.2" stroke-dasharray="36 18"><animate attributeName="stroke-dashoffset" values="0;-108" dur="7s" repeatCount="indefinite"/></rect>
    <rect width="320" height="215" rx="14" fill="url(#pshine)"><animateTransform attributeName="transform" type="translate" values="-320 0;320 0" dur="6s" begin="0s" repeatCount="indefinite"/></rect>
    <circle cx="30" cy="34" r="6" fill="#3178c6"><animate attributeName="r" values="5;7.5;5" dur="2.6s" repeatCount="indefinite"/></circle>
    <text x="48" y="40" class="pn" fill="#7db9e8">personal-agent-starter</text>
    <text x="26" y="72" class="pd">Local-first TypeScript personal-</text>
    <text x="26" y="92" class="pd">assistant starter: review-gated tools,</text>
    <text x="26" y="112" class="pd">Playwright sessions, SQLite history,</text>
    <text x="26" y="132" class="pd">pluggable models.</text>
    <text x="26" y="196" class="pl">TypeScript</text></g>

  <g transform="translate(340 10)"><rect width="320" height="215" rx="14" fill="#0f172a"/>
    <rect width="320" height="215" rx="14" fill="none" stroke="#00add8" stroke-width="2.5" filter="url(#pg)" opacity="0.5"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.4s" begin="0.5s" repeatCount="indefinite"/></rect>
    <rect width="320" height="215" rx="14" fill="none" stroke="#00add8" stroke-width="1.2" stroke-dasharray="36 18"><animate attributeName="stroke-dashoffset" values="0;-108" dur="7s" repeatCount="indefinite"/></rect>
    <rect width="320" height="215" rx="14" fill="url(#pshine)"><animateTransform attributeName="transform" type="translate" values="-320 0;320 0" dur="6s" begin="1s" repeatCount="indefinite"/></rect>
    <circle cx="30" cy="34" r="6" fill="#00add8"><animate attributeName="r" values="5;7.5;5" dur="2.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <text x="48" y="40" class="pn" fill="#5fd3f3">pulsebook</text>
    <text x="26" y="72" class="pd">Limit-order-book matching engine</text>
    <text x="26" y="92" class="pd">in Go: strict price-time priority,</text>
    <text x="26" y="112" class="pd">fixed-point ticks, validated on 100k</text>
    <text x="26" y="132" class="pd">real Binance BTCUSDT trades.</text>
    <text x="26" y="152" class="pd" fill="#67e8f9">429ns insert · 1.03M events/s replay</text>
    <text x="26" y="196" class="pl">Go</text></g>

  <g transform="translate(670 10)"><rect width="320" height="215" rx="14" fill="#0f172a"/>
    <rect width="320" height="215" rx="14" fill="none" stroke="#00add8" stroke-width="2.5" filter="url(#pg)" opacity="0.5"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.4s" begin="1s" repeatCount="indefinite"/></rect>
    <rect width="320" height="215" rx="14" fill="none" stroke="#00add8" stroke-width="1.2" stroke-dasharray="36 18"><animate attributeName="stroke-dashoffset" values="0;-108" dur="7s" repeatCount="indefinite"/></rect>
    <rect width="320" height="215" rx="14" fill="url(#pshine)"><animateTransform attributeName="transform" type="translate" values="-320 0;320 0" dur="6s" begin="2s" repeatCount="indefinite"/></rect>
    <circle cx="30" cy="34" r="6" fill="#00add8"><animate attributeName="r" values="5;7.5;5" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>
    <text x="48" y="40" class="pn" fill="#5fd3f3">gatekeeper</text>
    <text x="26" y="72" class="pd">Rate-limiting API gateway in Go:</text>
    <text x="26" y="92" class="pd">token bucket + sliding window</text>
    <text x="26" y="112" class="pd">(in-memory + atomic Redis Lua),</text>
    <text x="26" y="132" class="pd">consistent-hashing routing, live</text>
    <text x="26" y="152" class="pd">verdict dashboard.</text>
    <text x="26" y="196" class="pl">Go</text></g>

  <g transform="translate(10 245)"><rect width="320" height="215" rx="14" fill="#0f172a"/>
    <rect width="320" height="215" rx="14" fill="none" stroke="#00add8" stroke-width="2.5" filter="url(#pg)" opacity="0.5"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.4s" begin="1.5s" repeatCount="indefinite"/></rect>
    <rect width="320" height="215" rx="14" fill="none" stroke="#00add8" stroke-width="1.2" stroke-dasharray="36 18"><animate attributeName="stroke-dashoffset" values="0;-108" dur="7s" repeatCount="indefinite"/></rect>
    <rect width="320" height="215" rx="14" fill="url(#pshine)"><animateTransform attributeName="transform" type="translate" values="-320 0;320 0" dur="6s" begin="3s" repeatCount="indefinite"/></rect>
    <circle cx="30" cy="34" r="6" fill="#00add8"><animate attributeName="r" values="5;7.5;5" dur="2.6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <text x="48" y="40" class="pn" fill="#5fd3f3">cipherbase</text>
    <text x="26" y="72" class="pd">LSM-tree storage engine from</text>
    <text x="26" y="92" class="pd">scratch in Go: skip-list memtable,</text>
    <text x="26" y="112" class="pd">CRC WAL with crash replay, bloom-</text>
    <text x="26" y="132" class="pd">filtered SSTables, L0-&gt;L1 compaction,</text>
    <text x="26" y="152" class="pd">live dashboard.</text>
    <text x="26" y="172" class="pd" fill="#67e8f9">153k writes/s measured</text>
    <text x="26" y="196" class="pl">Go</text></g>

  <g transform="translate(340 245)"><rect width="320" height="215" rx="14" fill="#0f172a"/>
    <rect width="320" height="215" rx="14" fill="none" stroke="#00add8" stroke-width="2.5" filter="url(#pg)" opacity="0.5"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.4s" begin="2s" repeatCount="indefinite"/></rect>
    <rect width="320" height="215" rx="14" fill="none" stroke="#00add8" stroke-width="1.2" stroke-dasharray="36 18"><animate attributeName="stroke-dashoffset" values="0;-108" dur="7s" repeatCount="indefinite"/></rect>
    <rect width="320" height="215" rx="14" fill="url(#pshine)"><animateTransform attributeName="transform" type="translate" values="-320 0;320 0" dur="6s" begin="4s" repeatCount="indefinite"/></rect>
    <circle cx="30" cy="34" r="6" fill="#00add8"><animate attributeName="r" values="5;7.5;5" dur="2.6s" begin="2s" repeatCount="indefinite"/></circle>
    <text x="48" y="40" class="pn" fill="#5fd3f3">remembrall</text>
    <text x="26" y="72" class="pd">Local-first long-term memory for</text>
    <text x="26" y="92" class="pd">AI agents: HNSW from scratch +</text>
    <text x="26" y="112" class="pd">BM25 hybrid recall, decay +</text>
    <text x="26" y="132" class="pd">reinforcement, no vector DB,</text>
    <text x="26" y="152" class="pd">no embedding API.</text>
    <text x="26" y="196" class="pl">Go</text></g>

  <g transform="translate(670 245)"><rect width="320" height="215" rx="14" fill="#0f172a"/>
    <rect width="320" height="215" rx="14" fill="none" stroke="#3776ab" stroke-width="2.5" filter="url(#pg)" opacity="0.5"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.4s" begin="2.5s" repeatCount="indefinite"/></rect>
    <rect width="320" height="215" rx="14" fill="none" stroke="#3776ab" stroke-width="1.2" stroke-dasharray="36 18"><animate attributeName="stroke-dashoffset" values="0;-108" dur="7s" repeatCount="indefinite"/></rect>
    <rect width="320" height="215" rx="14" fill="url(#pshine)"><animateTransform attributeName="transform" type="translate" values="-320 0;320 0" dur="6s" begin="5s" repeatCount="indefinite"/></rect>
    <circle cx="30" cy="34" r="6" fill="#3776ab"><animate attributeName="r" values="5;7.5;5" dur="2.6s" begin="2.5s" repeatCount="indefinite"/></circle>
    <text x="48" y="40" class="pn" fill="#7db9e8">agentwatch</text>
    <text x="26" y="72" class="pd">A flight recorder and report card</text>
    <text x="26" y="92" class="pd">for AI agents: trace every step,</text>
    <text x="26" y="112" class="pd">replay it live, grade the run with</text>
    <text x="26" y="132" class="pd">explainable rules.</text>
    <text x="26" y="196" class="pl">Python</text></g>
</svg>
