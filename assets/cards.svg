<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><defs><filter id="g"><feGaussianBlur stdDeviation="3"/></filter></defs><style>text{font-family:Segoe UI,Helvetica,Arial,sans-serif}.t{font-size:17px;font-weight:700;letter-spacing:2px}.d{font-size:14px;fill:#cbd5e1}</style><g transform="translate(10 10)"><rect width="320" height="160" rx="16" fill="#0f172a"/>
